name: AI Market Radar

on:

  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

  push:
    branches:
      - main


jobs:

  market-radar:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # =====================================================
      # REGRESSION TESTS
      # =====================================================

      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -v


      # =====================================================
      # AI TOKEN PREFLIGHT (never print secret contents)
      # =====================================================

      - name: Check AI token configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is present (value hidden)."
          else
            echo "::warning::GEMINI_API_KEY secret is missing or empty; AI analysis will use fallback mode."
          fi


      # =====================================================
      # RUN AI MARKET RADAR
      # =====================================================

      - name: Run AI Market Radar

        env:

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          WHALE_ALERT_API_KEY: ${{ secrets.WHALE_ALERT_API_KEY }}

          GEMINI_MODEL: gemini-3.5-flash-lite

        run: |

          python src/main.py


      # =====================================================
      # SAVE STATE
      # =====================================================

      - name: Save radar state

        run: |

          git config user.name "AI Market Radar"

          git config user.email "actions@github.com"

          git add state.json

          git diff --cached --quiet || git commit -m "Update radar state"

          git pull --rebase origin main

          git push
