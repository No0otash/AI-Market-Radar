```yaml
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Check Android project
        run: |
          echo "Checking Android project..."
          ls -la android
          echo "Checking app..."
          ls -la android/app

      - name: Check Gradle wrapper
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew does not exist"
            echo "The Gradle wrapper is missing."
            exit 1
          fi

          chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Show APK
        run: |
          echo "Searching for APK..."
          find android/app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Market-Radar-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
```
