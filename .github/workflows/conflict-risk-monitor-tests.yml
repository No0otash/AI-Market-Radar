name: Conflict Risk Monitor Tests

on:
  pull_request:
    paths:
      - "src/conflict_risk_monitor.py"
      - "tests/test_conflict_risk_monitor.py"
      - ".github/workflows/conflict-risk-monitor-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test heuristic policy (no network/API calls)
        run: python -m unittest discover -s tests -p "test_conflict_risk_monitor.py"
